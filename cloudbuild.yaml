steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying to Google Cloud Project: internship-ac115"
        gcloud app deploy app.yaml --project=internship-ac115 --quiet
timeout: '600s'
options:
  logging: CLOUD_LOGGING_ONLY
